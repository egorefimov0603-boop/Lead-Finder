name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lead_finder_mvp/requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name LeadFinder `
            --add-data "lead_finder_mvp/app.py;." `
            --collect-all streamlit `
            --collect-all pandas `
            --collect-all numpy `
            --collect-all altair `
            --collect-all pyarrow `
            lead_finder_mvp/launcher.py

      - name: Include usage notes
        shell: pwsh
        run: |
          @"
          LEAD FINDER
          1. Распакуй всю папку LeadFinder из архива.
          2. Запусти LeadFinder.exe двойным щелчком.
          3. Не удаляй папку _internal.
          4. База leads.db создаётся рядом с exe. Делай резервные копии.
          "@ | Out-File -Encoding utf8 dist/LeadFinder/ИНСТРУКЦИЯ.txt

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: LeadFinder-Windows
          path: dist/LeadFinder/
          if-no-files-found: error
